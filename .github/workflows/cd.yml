name: CD

on: 
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  depoly:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-actions@v1
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            if [! -d ~/Three-tier-app-Devops ]; then
             git clone ${{ github.server_url }}/${{ github.repository }}.git ~/skillpulse
             fi
             cd ~/skillpulse
             git pull origin main
             if [! -f .env ]; then
                echo "ERROR: ~/skillpulse/.env is missing. Create it once with DOCKERHUB_USERNAME and DB credentials."
                exit 1
                fi
                docker compose pull
                docker compose up -d
                docker image prune -f
